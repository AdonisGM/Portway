# Local SSH servers for developing Portway. Only bound to 127.0.0.1.
# The public key mounted as authorized_keys defaults to ~/.ssh/id_ed25519.pub;
# override with PORTWAY_TEST_PUBKEY=/path/to/key.pub.
name: portway-test

x-server: &server
  restart: unless-stopped
  volumes:
    - ${PORTWAY_TEST_PUBKEY:-${HOME}/.ssh/id_ed25519.pub}:/authorized_keys:ro

services:
  # Has the Docker CLI and the host's Docker socket: root sees the real
  # containers, deploy is refused (not in the docker group). Also has ufw with
  # NET_ADMIN, so a firewall can be turned on inside this container only.
  ubuntu:
    <<: *server
    build: { context: ., dockerfile: Dockerfile.debian, args: { BASE: "ubuntu:24.04", DOCKER_CLI: "27.3.1", COMPOSE: "2.29.7", EXTRA_PKGS: "ufw iptables" } }
    cap_add: [NET_ADMIN]
    environment: { PORTWAY_UFW: "1" }
    hostname: pw-ubuntu
    ports: ["127.0.0.1:2201:22"]
    volumes:
      - ${PORTWAY_TEST_PUBKEY:-${HOME}/.ssh/id_ed25519.pub}:/authorized_keys:ro
      - /var/run/docker.sock:/var/run/docker.sock

  # Docker CLI talking to its own private daemon (dind below), never the host's:
  # safe for trying stop, remove and prune. deploy is in the docker group.
  debian:
    <<: *server
    build: { context: ., dockerfile: Dockerfile.debian, args: { BASE: "debian:12", DOCKER_CLI: "27.3.1", COMPOSE: "2.29.7" } }
    hostname: pw-debian
    ports: ["127.0.0.1:2202:22"]
    volumes:
      - ${PORTWAY_TEST_PUBKEY:-${HOME}/.ssh/id_ed25519.pub}:/authorized_keys:ro
      - dind-sock:/dind
    depends_on: [dind]

  # Docker daemon for pw-debian only. Its socket (group 2375 = docker in
  # pw-debian) is shared through the dind-sock volume; nothing is published.
  dind:
    image: docker:27-dind
    privileged: true
    restart: unless-stopped
    environment: { DOCKER_TLS_CERTDIR: "" }
    command: ["--host=unix:///dind/docker.sock", "--group=2375"]
    volumes:
      - dind-sock:/dind
      - dind-data:/var/lib/docker

  # systemd as PID 1, with nginx, redis, a crashing worker, a disabled
  # service, timers (one failing) and crontabs: services and scheduled tasks.
  systemd:
    build: { context: ., dockerfile: Dockerfile.systemd }
    restart: unless-stopped
    hostname: pw-systemd
    privileged: true
    cgroup: host
    tmpfs: [/run, /run/lock, /tmp]
    ports: ["127.0.0.1:2204:22"]
    volumes:
      - ${PORTWAY_TEST_PUBKEY:-${HOME}/.ssh/id_ed25519.pub}:/authorized_keys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  alpine:
    <<: *server
    build: { context: ., dockerfile: Dockerfile.alpine }
    hostname: pw-alpine
    ports: ["127.0.0.1:2203:22"]

volumes:
  dind-sock:
  dind-data:
