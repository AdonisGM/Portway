[package]
name = "portway"
version = "0.0.19"
description = "Portway desktop app"
authors = ["Portway"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "portway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "encryption", "getrandom"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
russh = "0.63"
russh-sftp = "3"
keyring = { version = "3", features = ["apple-native"] }
tokio = { version = "1", features = ["time", "sync", "net"] }

# Hide/show the native traffic lights while the splash screen is up.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# RSA key generation is unbearably slow unoptimised; build the bigint crates
# with optimisations even in dev.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
