[package]
name = "portway"
version = "0.25.0"
description = "Portway desktop app"
authors = ["Portway"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "portway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "encryption", "getrandom"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
# Start at login (a LaunchAgent on macOS, the Run key on Windows), and one copy only.
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
russh = "0.63"
russh-sftp = "3"
libc = "0.2"
base64 = "0.22"
# Keychain on macOS, Credential Manager on Windows.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# canonicalize without Windows' \\?\ prefix.
dunce = "1"
tokio = { version = "1", features = ["time", "sync", "net", "rt", "io-util", "macros", "fs"] }
snow = "0.9"
mdns-sd = "0.21"
# Pictures on the clipboard travel as PNG: read the size without decoding, encode RGBA.
png = "0.17"

blake2 = "0.10"
netdev = "0.46.3"
# File URLs from the macOS pasteboard (already in the tree through Tauri).
url = "2"
# Specs of this machine (CPU, memory, disk) that a linked machine shows.
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk", "network"] }

# Hide/show the native traffic lights while the splash screen is up.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow", "NSWorkspace", "NSPasteboard", "NSPasteboardItem"] }
# Ask LaunchServices which apps open text files (Sửa tệp › editor list).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }

# Which process owns a local TCP connection (tunnel monitor) on Windows.
[target.'cfg(windows)'.dependencies]
# COM for pasting files that are fetched when pasted (an IDataObject).
windows-core = "0.61"
# The pre-login beacon: a small Windows service.
windows-service = "0.8"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi"] }
# Model and graphics cards from the registry.
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_Shell"] }
# russh's crypto backend; use the NASM objects shipped with aws-lc-sys so the
# build does not need NASM installed.
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# RSA key generation is unbearably slow unoptimised; build the bigint crates
# with optimisations even in dev.
# The link's encryption and hashing: unoptimized they cap file transfers and
# the speed test at a few MB/s in a dev build, which says nothing about the network.
[profile.dev.package.snow]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.cipher]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Encoding a screenshot is slow unoptimised, like the link's crypto above.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
